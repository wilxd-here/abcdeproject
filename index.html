<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xaerisoft</title>
<meta name="theme-color" content="#FBF3E4">
<script>
/* Ikuti tema yang dipilih pengguna supaya tidak berkedip */
(function(){var T={default:["#FBF3E4","#FFFCF6","#2E2A3B","#CF4226","#A6E3D3","#FFE08A","#fff","#2E2A3B"],mono:["#F1F1EF","#fff","#141414","#141414","#D6D6D6","#BEBEBC","#fff","#141414"],obsidian:["#0E0A18","#181226","#EEE8FF","#7C4DF0","#2C1F55","#4B2370","#fff","#6E52C8"],universe:["#060A1C","#0F1636","#E7EDFF","#22D3EE","#1B2766","#43206A","#04141F","#4E67D6"]},k="default",a=null;
try{k=localStorage.getItem("xa-theme");a=localStorage.getItem("xa-accent")}catch(e){}
if(!T[k])k="default";var v=T[k].slice();
if(k==="default"&&/^#[0-9a-f]{6}$/i.test(a||"")){v[3]=a;var r=parseInt(a.substr(1,2),16),g=parseInt(a.substr(3,2),16),b=parseInt(a.substr(5,2),16);v[6]=(.299*r+.587*g+.114*b)>150?"#1b1722":"#fff"}
var n=["bg","card","ink","accent","blue","c3","on","bd"],s=document.documentElement.style;
n.forEach(function(x,i){s.setProperty("--"+x,v[i])});
document.querySelector("meta[name=theme-color]").content=v[0]})();
</script>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(color-mix(in srgb,var(--accent) 18%,transparent) 1.3px,transparent 1.5px) 0 0/22px 22px,var(--bg);color:var(--ink);font:16px/1.5 ui-rounded,"Avenir Next","Segoe UI",system-ui,sans-serif;overflow:hidden;--ease:cubic-bezier(.2,.7,.2,1)}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 24px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;transition:opacity .35s var(--ease),transform .35s var(--ease)}
body.out main{opacity:0;transform:translateY(-10px) scale(.97)}
.stage{position:relative;width:min(300px,86vw);height:210px;margin-bottom:6px}
.logo{position:absolute;left:50%;top:50%;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:30px;background:var(--accent);color:var(--on);border:3px solid var(--bd);box-shadow:6px 6px 0 var(--bd);display:grid;place-items:center;animation:drop .8s var(--ease) both}
.logo svg{width:52px;height:52px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.s{position:absolute;width:50px;height:50px;border:2px solid var(--bd);border-radius:15px;box-shadow:3px 3px 0 var(--bd);display:grid;place-items:center;background:var(--blue);color:var(--ink);opacity:0;transform:rotate(var(--r));animation:pop .45s var(--ease) forwards;animation-delay:calc(.6s + var(--d)*.13s)}
.s:nth-child(2){background:var(--c3)}.s:nth-child(3){background:var(--card)}.s:nth-child(4){background:color-mix(in srgb,var(--accent) 24%,var(--card))}
.s svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.wm{font-size:clamp(42px,13vw,60px);font-weight:900;line-height:1;letter-spacing:-.045em}
.wm span{display:inline-block;opacity:0;transform:translateY(.45em);animation:rise .5s var(--ease) forwards;animation-delay:calc(.8s + var(--i)*.05s)}
.tag{max-width:19em;opacity:0;animation:rise .6s var(--ease) 1.3s forwards;color:color-mix(in srgb,var(--ink) 68%,var(--bg))}
.bar{width:min(240px,70vw);height:16px;border:2px solid var(--bd);border-radius:999px;background:var(--card);overflow:hidden;margin-top:10px;opacity:0;animation:rise .4s var(--ease) 1.2s forwards}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-right:2px solid var(--bd);transition:width .35s var(--ease)}
#st{font-size:14px;font-weight:700;min-height:1.5em}
.er{max-width:320px;display:grid;gap:8px;justify-items:center;padding:14px;border:2px solid var(--bd);border-radius:16px;background:var(--card);box-shadow:4px 4px 0 var(--accent)}
.er[hidden]{display:none}
.er span{font-size:14px}
.er button{font:inherit;font-weight:700;border:2px solid var(--bd);border-radius:12px;padding:9px 18px;min-height:44px;background:var(--accent);color:var(--on);box-shadow:3px 3px 0 var(--bd);cursor:pointer}
.er button:active{transform:translate(2px,2px);box-shadow:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@keyframes drop{0%{transform:translateY(-90px) rotate(-14deg) scale(1.15);opacity:0;box-shadow:18px 18px 0 var(--bd)}50%{opacity:1}72%{transform:translateY(0) rotate(2deg) scale(.95);box-shadow:2px 2px 0 var(--bd)}100%{transform:none;box-shadow:6px 6px 0 var(--bd)}}
@keyframes pop{0%{transform:scale(0) rotate(var(--r));opacity:0}70%{transform:scale(1.14) rotate(var(--r))}100%{transform:scale(1) rotate(var(--r));opacity:1}}
@keyframes rise{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}}
</style>
</head>
<body>
<main aria-busy="true">
  <div class="stage" aria-hidden="true">
    <i class="s" style="--r:-10deg;--d:0;left:2px;top:16px"><svg viewBox="0 0 24 24"><path d="M8 4C6 4 6 6 6 8s0 4-2 4c2 0 2 2 2 4s0 4 2 4M16 4c2 0 2 2 2 4s0 4 2 4c-2 0-2 2-2 4s0 4-2 4"/></svg></i>
    <i class="s" style="--r:9deg;--d:1;right:4px;top:2px"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></i>
    <i class="s" style="--r:7deg;--d:2;left:14px;bottom:4px"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1" fill="currentColor"/><circle cx="15" cy="15" r="1" fill="currentColor"/><circle cx="15" cy="9" r="1" fill="currentColor"/><circle cx="9" cy="15" r="1" fill="currentColor"/></svg></i>
    <i class="s" style="--r:-8deg;--d:3;right:0;bottom:16px"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 01-11.5 7.2L4 20l1-4A8 8 0 1120 12z"/></svg></i>
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
  </div>
  <h1 class="wm" aria-label="Xaerisoft"></h1>
  <p class="tag">Tools kecil buatan Wilverse, langsung jalan di browser.</p>
  <div class="bar" role="progressbar" aria-label="Memuat Xaerisoft" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="f"></i></div>
  <p id="st" role="status">Menyiapkan meja kerja…</p>
  <div id="er" class="er" hidden><b>Xaerisoft gagal dimuat</b><span id="em"></span><button id="rt" type="button">Coba lagi</button></div>
</main>
<noscript><p style="position:fixed;inset:auto 0 24px;text-align:center">Xaerisoft butuh JavaScript untuk berjalan.</p></noscript>
<script>
(function(){
var SRC="payload_xaerisoft.txt",$=function(s){return document.querySelector(s)},red=matchMedia("(prefers-reduced-motion:reduce)").matches;
var w=$(".wm");"Xaerisoft".split("").forEach(function(c,i){var e=document.createElement("span");e.textContent=c;e.style.setProperty("--i",i);w.appendChild(e)});
var f=$("#f"),st=$("#st"),bar=$(".bar");
function set(p){p=Math.max(0,Math.min(1,p));f.style.width=p*100+"%";bar.setAttribute("aria-valuenow",Math.round(p*100));st.textContent=p>=1?"Siap":p>.7?"Hampir siap…":p>.25?"Memuat tools…":"Menyiapkan meja kerja…"}
var wait=new Promise(function(r){setTimeout(r,red?300:2400)});
async function get(){
  var r=await fetch(SRC,{cache:"no-cache"});if(!r.ok)throw new Error("HTTP "+r.status);
  if(!r.body||!r.body.getReader)return r.text();
  var tot=+r.headers.get("content-length")||0,est=tot&&!r.headers.get("content-encoding")?tot:90000,got=0,t="",rd=r.body.getReader(),d=new TextDecoder();
  for(;;){var x=await rd.read();if(x.done)break;got+=x.value.length;t+=d.decode(x.value,{stream:true});set(Math.min(.9,got/est))}
  return t+d.decode()}
async function go(){
  $("#er").hidden=true;set(0);
  try{
    var t=(await Promise.all([get(),wait]))[0];
    set(1);await new Promise(function(r){setTimeout(r,320)});
    document.body.classList.add("out");await new Promise(function(r){setTimeout(r,red?0:380)});
    document.open();document.write(t);document.close();
  }catch(e){
    $("#em").textContent=e.message+". Buka lewat server (GitHub Pages), bukan langsung dari file.";
    $("#er").hidden=false;wait=Promise.resolve();
  }}
$("#rt").onclick=go;go();
})();
</script>
</body>
</html>
